<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Horizon: astronaut health monitor</title>
  <meta name="description" content="Log your health readings, see your status at a glance and know what to do next, even with no connection to Earth.">
  <meta name="theme-color" content="#04060B">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preload" href="assets/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/bodoni-moda-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <canvas id="hero-canvas" aria-hidden="true"></canvas>
  <div id="hero-still" aria-hidden="true"></div>

  <nav class="rail" aria-label="Main">
    <a class="brand" href="#/today" aria-label="Horizon home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M2 24c4-7 9-10 14-10s10 3 14 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="22" cy="8" r="2" fill="currentColor"/></svg>
      <span>Horizon</span>
    </a>
    <ul class="rail-links" id="nav-main"></ul>
    <p class="rail-section">More</p>
    <ul class="rail-links" id="nav-more"></ul>
    <div class="rail-foot" id="rail-foot"></div>
  </nav>

  <header class="topbar">
    <a class="brand" href="#/today" aria-label="Horizon home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M2 24c4-7 9-10 14-10s10 3 14 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="22" cy="8" r="2" fill="currentColor"/></svg>
      <span>Horizon</span>
    </a>
    <div class="topbar-right">
      <span class="net-pill" id="net-pill" role="status"></span>
      <button class="icon-btn" id="menu-btn" aria-label="Open menu" aria-expanded="false" aria-controls="more-sheet">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <div class="sheet" id="more-sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="Menu">
      <ul class="sheet-links" id="nav-sheet"></ul>
      <button class="btn ghost" data-close>Close</button>
    </div>
  </div>

  <main id="main" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Main tabs"><ul id="nav-tabs"></ul></nav>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">Horizon needs JavaScript to run.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
